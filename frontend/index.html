<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POC Items App</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.4rem; }
  form { display: flex; gap: 8px; margin-bottom: 24px; }
  input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 8px 14px; border: none; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
  button.del { background: #dc2626; }
  ul { list-style: none; padding: 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; }
  #status { color: #b91c1c; margin-bottom: 12px; }
</style>
</head>
<body>
  <h1>POC: Frontend → Backend → Azure SQL</h1>
  <div id="status"></div>

  <form id="itemForm">
    <input id="nameInput" placeholder="Item name" required />
    <input id="descInput" placeholder="Description" />
    <button type="submit">Add</button>
  </form>

  <ul id="itemList"></ul>

<script>
  const API_BASE = window.API_BASE_URL || "https://app-poc-backend-fsefbfd5faczazfb.centralindia-01.azurewebsites.net";

  const listEl = document.getElementById('itemList');
  const statusEl = document.getElementById('status');
  const form = document.getElementById('itemForm');

  async function loadItems() {
    statusEl.textContent = '';
    try {
      const res = await fetch(`${API_BASE}/api/items`);
      if (!res.ok) throw new Error('Failed to load');
      const items = await res.json();
      listEl.innerHTML = items.map(i => `
        <li>
          <span><strong>${i.Name}</strong> — ${i.Description || ''}</span>
          <button class="del" onclick="deleteItem(${i.Id})">Delete</button>
        </li>
      `).join('');
    } catch (err) {
      statusEl.textContent = 'Could not reach backend API. Check API_BASE_URL and CORS.';
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('nameInput').value;
    const description = document.getElementById('descInput').value;
    await fetch(`${API_BASE}/api/items`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, description })
    });
    form.reset();
    loadItems();
  });

  async function deleteItem(id) {
    await fetch(`${API_BASE}/api/items/${id}`, { method: 'DELETE' });
    loadItems();
  }

  loadItems();
</script>
</body>
</html>
